name: post
on:
  schedule:
    # UTC hours cover 18:00 and 00:00 UK time in both BST and GMT. Add hours here for other slots.
    - cron: '*/15 17,18,23,0 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: Dry run (post nothing)
        type: boolean
        default: true
concurrency: poster
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Post due items
        run: node src/run.mjs
        env:
          DRY_RUN: ${{ inputs.dry && '1' || '0' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
      - name: Save posted state
        if: always()
        run: |
          git config user.name "social-poster"
          git config user.email "actions@users.noreply.github.com"
          git add state/posted.json
          git diff --cached --quiet || (git commit -m "Record posted items" && git push)
